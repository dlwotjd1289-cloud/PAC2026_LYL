generation:
  observation:
    mode: identity
  future_weight_visibility: unknown_individual_weight
  # normal/light/heavy draw inside the SKU's own weight range, so bigger boxes
  # tend to be heavier. stress ignores size (stress_weight_range_kg) and makes
  # the exceptions: 0.13 + 0.20 * 0.10 = 15% of boxes, corr(volume, weight) ~0.5.
  weight_profile_distribution:
    normal: 0.49
    light_biased: 0.09
    heavy_biased: 0.09
    mixed: 0.20
    stress: 0.13
  mixed_component_distribution:
    normal: 0.45
    light_biased: 0.20
    heavy_biased: 0.25
    stress: 0.10
  stress_weight_range_kg: [0.2, 30.0]
  benchmark:
    boxes_per_scenario: 24
    seed: 20261007
    family_counts:
      normal: 100
      size_mixed: 100
      weight_mixed: 100
      late_large: 100
      late_heavy: 100
      repeated_sku: 100

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
