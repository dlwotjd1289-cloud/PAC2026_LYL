schema_version: 1

dataset:
  name: ahead_kr_general_parcel

parcel_domain:
  name: kr_general_parcel
  max_weight_kg: 30.0
  max_dimension_sum_m: 1.6
  max_single_side_m: 1.0
  scope_note: >-
    AHEAD experiment profile for Korean general parcel scenarios. This is a
    dataset scope, not a robot payload limit.

pallet:
  # Footprint, deck height, cargo height and load limit come from the team
  # config (repo config/default.yaml, pac_common.config). Add explicit keys
  # here (pallet_id, size_x_m, size_y_m, deck_height_m, max_stack_height_m,
  # max_load_kg) only to override them for an experiment.
  source: common
  standard_name: T11

